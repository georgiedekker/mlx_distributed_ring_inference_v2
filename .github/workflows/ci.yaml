# CI Pipeline - Lint & Security only
# This repo lives at georgiedekker/mlx_distributed_ring_inference_v2 (outside
# the nonagenticai org), so it cannot reach the org's self-hosted runner pool.
# Lint + security scan run fine on ubuntu-latest; real MLX execution happens
# locally on mini1/mini2 (skip_tests=true).
# Layout is FLAT: api.py, server.py, distributed/, config/ at the repo root.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff linter (check only)
        run: uv run ruff check .

      - name: Run ruff formatter (check only)
        run: uv run ruff format --check .

      - name: Install security tools
        run: uv pip install bandit pip-audit

      - name: Security scan - bandit
        run: uv run bandit -r . -x ./.venv,./venv,./archived_features -ll -ii

      - name: Security scan - pip-audit
        run: uv run pip-audit --skip-editable
