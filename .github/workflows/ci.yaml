# CI Pipeline - Lint & Security only
# This repo requires Apple Silicon (MLX) — runs on the mini2-darwin self-hosted
# runner (labels self-hosted/macOS/ARM64/darwin/mlx).
# Layout is FLAT: api.py, server.py, distributed/, config/ at the repo root.
# No ty (some MLX paths). No pytest (skip_tests=true).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & Security
    runs-on: [self-hosted, macOS, ARM64, mlx]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff linter (check only)
        run: uv run ruff check .

      - name: Run ruff formatter (check only)
        run: uv run ruff format --check .

      - name: Install security tools
        run: uv pip install bandit pip-audit

      - name: Security scan - bandit
        run: uv run bandit -r . -x ./.venv,./venv,./archived_features -ll -ii

      - name: Security scan - pip-audit
        run: uv run pip-audit --skip-editable
